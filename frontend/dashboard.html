<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>루트온 — 관리자 대시보드</title>
  <script>
    const API = 'http://168.138.45.63:8000';

    function getToken() { return localStorage.getItem('token'); }
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
    }

    // ETA 계산: started_at + estimated_duration_min → 예상 완료 시각
    function calcETADate(trip) {
      if (!trip || trip.status !== 'in_progress') return null;
      const dur = trip.optimized_route?.estimated_duration_min;
      if (!dur || !trip.started_at) return null;
      return new Date(new Date(trip.started_at).getTime() + dur * 60 * 1000);
    }

    function formatTime(date) {
      return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    // 기사 카드용 한 줄 ETA 문자열
    function formatCardETA(trip) {
      const eta = calcETADate(trip);
      if (!eta) return '';
      const now = Date.now();
      const diffMin = Math.round((eta - now) / 60000);
      if (diffMin < 0) return `⏰ 예상 완료 ${formatTime(eta)} (초과 ${Math.abs(diffMin)}분)`;
      return `⏰ 예상 완료 ${formatTime(eta)} (약 ${diffMin}분 남음)`;
    }

    // ── 경로 진행도 계산 헬퍼 ─────────────────────────
    function haversineKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLon = (b.lon - a.lon) * Math.PI / 180;
      const x = Math.sin(dLat/2)**2 +
        Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    // 폴리라인 좌표 배열 → 누적 거리(km) 배열
    function buildCumulativeDist(points) {
      const dists = [0];
      for (let i = 1; i < points.length; i++) {
        dists.push(dists[i - 1] + haversineKm(points[i - 1], points[i]));
      }
      return dists;
    }

    // 각 노드의 폴리라인 상 비율 (0~1) 배열
    function getNodeRatios(nodes, points) {
      if (!points || points.length < 2) {
        return nodes.map((_, i) => i / Math.max(1, nodes.length - 1));
      }
      const cumDists = buildCumulativeDist(points);
      const total = cumDists[cumDists.length - 1];
      if (total === 0) return nodes.map((_, i) => i / Math.max(1, nodes.length - 1));
      return nodes.map(n => {
        if (n.lat == null || n.lon == null) return -1;
        const idx = _findNearestIdx(points, n.lat, n.lon);
        return cumDists[idx] / total;
      });
    }

    // 기사의 현재 폴리라인 상 비율 (0~1), 없으면 -1
    function getDriverRatio(driverId) {
      const pos = driverCurrentPositions[driverId];
      if (!pos) return -1;
      const points = driverPolylinePoints[driverId];
      if (!points || points.length < 2) return -1;
      const cumDists = buildCumulativeDist(points);
      const total = cumDists[cumDists.length - 1];
      if (total === 0) return -1;
      const idx = _findNearestIdx(points, pos.lat, pos.lon);
      return cumDists[idx] / total;
    }

    if (!getToken()) window.location.href = '/login.html';
  </script>

      width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; background: #fff; color: #333; margin-bottom: 14px; box-sizing: border-box;
    }
    .rs-transfer-row {
      display: flex; align-items: flex-start; gap: 10px;

      padding: 10px 12px; margin-bottom: 16px;

    .rs-transfer-row label { font-size: 13px; color: #5d4037; line-height: 1.5; cursor: pointer; }
  </style>
</head>

        <span id="trip-eta-time" style="font-size:14px; font-weight:700; color:#2c3e50; margin-left:8px;"></span>

      <div id="cancel-request-box" style="display:none; margin-bottom:10px; padding:10px 12px; background:#fff8e1; border-radius:8px; border:1px solid #ffe082;">

      <div style="display:flex; gap:8px;">

          <span style="font-size:10px; font-weight:700; color:#555;">📋 배송 태스크 <span style="color:#e74c3c;">*</span> <span style="font-weight:normal; color:#bbb;">(지도 클릭 또는 검색 입력)</span></span>
          <button onclick="tbAddTask()" style="padding:3px 9px; background:#e67e22; color:#fff; border:none; border-radius:10px; font-size:11px; cursor:pointer; font-weight:600;">+ 태스크 추가</button>

        <option value="">차량 선택</option>

        style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:13px; margin-bottom:10px; box-sizing:border-box; background:#fff;">

    </div>


    <!-- 경로 노드 리스트 -->
    <div id="route-nodes-box" style="display:none; margin-bottom:20px;">
      <h3 style="margin-bottom:10px;">📍 경로</h3>

  </div>

  <script>
    let map;
    let markers = {};
    let currentDriverId   = null;
    let _polylineClicked  = false;
    let driverPolylines      = {};  // driver_id → [passedPolyline, remainingPolyline]
    let driverPolylinePoints = {};  // driver_id → [{lat, lon}, ...]
    let driverRouteMarkers  = {};  // driver_id → [CustomOverlay, ...]

    const DRIVER_COLORS = [
      '#3498db','#e74c3c','#2ecc71','#f39c12',
      '#9b59b6','#1abc9c','#e67e22','#34495e',
    ];
    let driverColorMap = {};  // driver_id → color string
    let driverUnreadCounts = {};
    let convDriverMap = {};  // conversation_id → driver_id
    let currentUserId = null;
    let driverCurrentPositions = {};  // driver_id → {lat, lon}

    // ── 기능 전역 상태 ────────────────────────────────
    let _acCoords    = {};   // inputId → {lat, lon}  자동완성 선택 좌표
    let _acResults   = {};   // inputId → 검색 결과 배열
    let _acDebounce  = {};   // inputId → setTimeout id
    let _dragSrcIdx      = null;
    let _nodePopupEl     = null;

    function initMap() {
      const container = document.getElementById('map');
      const options = { center: new kakao.maps.LatLng(37.3950, 127.1110), level: 5 };
      map = new kakao.maps.Map(container, options);
      kakao.maps.event.addListener(map, 'click', onMapClick);
      initCursorHover();
    }

    function initCursorHover() {
      const mapEl    = document.getElementById('map');
      let debounce   = null;
      let gen        = 0;
      const geoCache = {};  // "lat4,lon4" → coord2Address result
      const poiCache = {};  // "kw:lat4,lon4" → boolean

      const _key = (lat, lon) => `${lat.toFixed(4)},${lon.toFixed(4)}`;

      // 캐시에서 즉시 커서 반영 (API 호출 없음)
      // 반환값: true = 캐시 완전 적중(추가 API 불필요), false = 아직 미확인
      function _applyCache(lat, lon, key) {
        const geo = geoCache[key];
        if (!geo) return false;

        if (geo[0].road_address?.building_name) {
          mapEl.classList.add('poi-hover');
          return true;
        }
        const ra = geo[0].road_address;
        if (!ra) { mapEl.classList.remove('poi-hover'); return true; }

        const pk = `${ra.road_name} ${ra.main_building_no}:${key}`;
        if (!(pk in poiCache)) return false;  // geocode 캐시 O, places 캐시 X
        poiCache[pk] ? mapEl.classList.add('poi-hover') : mapEl.classList.remove('poi-hover');
        return true;
      }

      function _placesCheck(lat, lon, key, result, myGen) {
        if (gen !== myGen) return;
        const ra = result[0].road_address;
        if (!ra) return;
        const kw = `${ra.road_name} ${ra.main_building_no}`;
        const pk = `${kw}:${key}`;

        if (pk in poiCache) {
          if (poiCache[pk]) mapEl.classList.add('poi-hover');
          return;
        }
        const ps = new kakao.maps.services.Places();
        ps.keywordSearch(kw, (places, pStatus) => {
          if (gen !== myGen) return;
          const has = pStatus === kakao.maps.services.Status.OK && places.length > 0;
          poiCache[pk] = has;
          if (has) mapEl.classList.add('poi-hover');
        }, { location: new kakao.maps.LatLng(lat, lon), radius: 30, sort: kakao.maps.services.SortBy.DISTANCE });
      }

      kakao.maps.event.addListener(map, 'mousemove', e => {
        clearTimeout(debounce);
        gen++;
        const ll  = e.latLng;
        const lat = ll.getLat(), lon = ll.getLng();
        const key = _key(lat, lon);

        // 캐시 완전 적중 → 즉시 반영, API 불필요
        if (_applyCache(lat, lon, key)) return;
        mapEl.classList.remove('poi-hover');

        const myGen = gen;
        debounce = setTimeout(() => {
          if (gen !== myGen) return;

          if (geoCache[key]) {
            // geocode 캐시 O → Places만 조회
            if (!geoCache[key][0].road_address?.building_name) {
              _placesCheck(lat, lon, key, geoCache[key], myGen);
            } else {
              mapEl.classList.add('poi-hover');
            }
            return;
          }

          // geocode 캐시 X → coord2Address → Places
          const gc = new kakao.maps.services.Geocoder();
          gc.coord2Address(lon, lat, (result, status) => {
            if (gen !== myGen) return;
            if (status !== kakao.maps.services.Status.OK) return;
            geoCache[key] = result;

            if (result[0].road_address?.building_name) {
              mapEl.classList.add('poi-hover');
              return;
            }
            _placesCheck(lat, lon, key, result, myGen);
          });
        }, 150);
      });

      kakao.maps.event.addListener(map, 'dragstart', () => {
        clearTimeout(debounce);
        gen++;
        mapEl.classList.remove('poi-hover');
      });
    }

    function onMapClick(e) {
      if (_polylineClicked) { _polylineClicked = false; return; }
      hideNodePopup();
      if (_searchPinOverlay) { _searchPinOverlay.setMap(null); _searchPinOverlay = null; }

      const ll  = e.latLng;
      const lat = ll.getLat();
      const lon = ll.getLng();

      const gc = new kakao.maps.services.Geocoder();
      gc.coord2Address(lon, lat, (result, status) => {
        let addr = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

        if (status !== kakao.maps.services.Status.OK) {
          showSearchPin(lat, lon, addr, addr);
          return;
        }

        addr = result[0].road_address?.address_name
            || result[0].address?.address_name
            || addr;

        // building_name이 있으면 이름으로 우선 사용, 없어도 Places로 보충
        const buildingName = result[0].road_address?.building_name;
        const ra = result[0].road_address;
        const keyword = ra
          ? `${ra.road_name} ${ra.main_building_no}${ra.sub_building_no ? '-' + ra.sub_building_no : ''}`
          : addr;

        const ps = new kakao.maps.services.Places();
        ps.keywordSearch(keyword, (places, pStatus) => {
          let name = buildingName || addr;
          let info = {};
          if (pStatus === kakao.maps.services.Status.OK && places.length > 0) {
            const p = places[0];
            name = p.place_name;  // Places 이름 항상 우선 (더 정확한 개별 장소명)
            info = { phone: p.phone || '', category: p.category_name || '', placeUrl: p.place_url || '' };
          }
          showSearchPin(lat, lon, name, addr, info);
        }, {
          location: new kakao.maps.LatLng(lat, lon),
          radius: 30,
          sort: kakao.maps.services.SortBy.DISTANCE,
        });
      });
    }

    // 💡 왼쪽 패널 토글(접기/펴기) 기능
    function togglePanel() {
      const panel = document.getElementById('left-panel');
      const btn = document.getElementById('toggle-btn');
      panel.classList.toggle('collapsed');
      
      if (panel.classList.contains('collapsed')) {
        btn.innerText = '▶';
        btn.title = '메뉴 펴기';
      } else {
        btn.innerText = '◀';
        btn.title = '메뉴 접기';
      }
      setTimeout(() => map.relayout(), 300);
    }

    // 전체 기사+운행 정보 캐시
    let driversCache = [];
    let tripsCache = {};  // driver_id → trip

    async function loadDrivers() {
      const res = await fetch(`${API}/users?role=driver`, { headers: authHeaders() });
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      driversCache = await res.json();

      // 각 기사의 진행 중 운행 조회
      const tripPromises = driversCache.map(d =>
        fetch(`${API}/trips?driver_id=${d.id}`, { headers: authHeaders() })
          .then(r => r.ok ? r.json() : [])
          .then(trips => { tripsCache[d.id] = trips.find(t => ['scheduled','in_progress'].includes(t.status)) || null; })
          .catch(() => { tripsCache[d.id] = null; })
      );
      await Promise.all(tripPromises);

      // 기사별 고정 색상 배정 (순서 기반, 새로고침 후에도 동일)
      driversCache.forEach((d, i) => {
        if (!driverColorMap[d.id]) {
          driverColorMap[d.id] = DRIVER_COLORS[i % DRIVER_COLORS.length];
        }
      });

      await loadChatConversations();
      renderLeftPanel(driversCache);
      initTripBuilder();
      drawAllRunningPolylines();
    }

    async function drawAllRunningPolylines() {
      const running = driversCache.filter(d => tripsCache[d.id]?.status === 'in_progress');
      await Promise.all(running.map(d => {
        const trip = tripsCache[d.id];
        return drawDriverPolyline(d.id, trip.id, driverColorMap[d.id]);
      }));
    }

    function renderLeftPanel(drivers) {
      const listDiv = document.getElementById('driver-list');
      listDiv.innerHTML = '';

      if (drivers.length === 0) {
        listDiv.innerHTML = '<p style="color:gray; text-align:center; padding:20px; font-size:13px;">등록된 기사가 없습니다.</p>';
        return;
      }

      drivers.forEach(d => {
        const trip = tripsCache[d.id];
        const isRunning = trip?.status === 'in_progress';
        const isScheduled = trip?.status === 'scheduled';
        const card = document.createElement('div');
        card.className = `driver-card ${d.id === currentDriverId ? 'active' : ''}`;
        card.id = `card-${d.id}`;
        card.onclick = () => showDriverDetail(d.id);
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:15px; color:#333;">${d.name || d.username} 기사</strong>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="chat-unread" id="chat-unread-${d.id}">${driverUnreadCounts[d.id] || 0}</span>
              <button class="card-chat-btn" title="채팅 열기">💬</button>
              <span class="status-badge ${isRunning ? 'bg-green' : isScheduled ? 'bg-orange' : ''}"
                style="${!isRunning && !isScheduled ? 'background:#ccc' : ''}">
                ${isRunning ? '운행 중' : isScheduled ? '출발 대기' : '대기 중'}</span>
            </div>
          </div>
          <small style="color:gray; display:block; margin-top:5px;">
            ${trip
              ? (trip.dest_name
                  ? `🚛 ${trip.dest_name}`
                  : `🏗️ 상차 ${trip.loading_count||0}건 / 📦 하차 ${trip.unloading_count||0}건`)
              : '배차 없음'}
          </small>
          ${isRunning ? `<small id="card-eta-${d.id}" style="color:#555; display:block; margin-top:3px; font-size:11px;">${formatCardETA(trip)}</small>` : ''}
          ${trip?.cancel_requested ? `<small style="color:#e65100; display:block; margin-top:3px; font-size:11px; font-weight:bold;">⚠️ 배차 취소 요청</small>` : ''}
        `;
        card.querySelector('.card-chat-btn').addEventListener('click', e => {
          e.stopPropagation();
          window.open(`/chat.html?driver_id=${d.id}`, '_blank');
        });
        listDiv.appendChild(card);
        updateDriverUnreadBadge(d.id, driverUnreadCounts[d.id] || 0);
      });
    }

    function createCustomMarkerElement(name, id) {
      const color = driverColorMap[id] || '#333';
      const content = document.createElement('div');
      content.className = 'custom-app-marker';
      content.id = `marker-${id}`;
      content.style.borderColor = color;
      content.addEventListener('mousedown', e => e.stopPropagation());
      content.onclick = (e) => { e.stopPropagation(); showDriverDetail(id); };
      content.innerHTML = `<div class="content"><span class="icon">🚚</span><span class="name">${name}</span></div>`;
      // 말풍선 꼬리 색상도 맞춤
      const style = document.createElement('style');
      style.textContent = `#marker-${id}:after { border-color: ${color} transparent transparent; }`;
      content.appendChild(style);
      return content;
    }

    async function showDriverDetail(id) {
      currentDriverId = id;

      document.querySelectorAll('.driver-card').forEach(c => c.classList.remove('active'));
      const cardEl = document.getElementById(`card-${id}`);
      if(cardEl) cardEl.classList.add('active');

      document.querySelectorAll('.custom-app-marker').forEach(m => m.classList.remove('active'));
      const markerEl = document.getElementById(`marker-${id}`);
      if(markerEl) markerEl.classList.add('active');

      // 기사 배송 목록 조회
      const res = await fetch(`${API}/deliveries`, { headers: authHeaders() });
      const allDeliveries = await res.json();
      const driverDeliveries = allDeliveries.filter(d => d.assigned_to === id);

      // 현재(또는 마지막) 위치 조회
      const badge = document.getElementById('driver-location-badge');
      try {
        const locRes = await fetch(`${API}/location-logs/${id}`, { headers: authHeaders() });
        if (locRes.ok) {
          const loc = await locRes.json();
          driverCurrentPositions[id] = { lat: loc.lat, lon: loc.lon };
          map.panTo(new kakao.maps.LatLng(loc.lat, loc.lon));
          if (badge) {
            if (loc.is_realtime) {
              badge.textContent = '🟢 실시간 위치';
              badge.style.cssText = 'display:inline-block; margin-top:6px; font-size:11px; padding:3px 8px; border-radius:10px; background:#e8f5e9; color:#2e7d32;';
            } else {
              const ago = loc.recorded_at
                ? (() => { const m = Math.round((Date.now() - new Date(loc.recorded_at)) / 60000); return m < 60 ? `${m}분 전` : `${Math.round(m/60)}시간 전`; })()
                : '';
              badge.textContent = `🔘 마지막 위치${ago ? ' · ' + ago : ''}`;
              badge.style.cssText = 'display:inline-block; margin-top:6px; font-size:11px; padding:3px 8px; border-radius:10px; background:#f5f5f5; color:#888;';
            }
          }
        } else if (badge) {
          badge.textContent = '위치 정보 없음';
          badge.style.cssText = 'display:inline-block; margin-top:6px; font-size:11px; padding:3px 8px; border-radius:10px; background:#fafafa; color:#bbb;';
        }
      } catch(e) { if (badge) badge.style.display = 'none'; }

      // 폴리라인 강조 + 노드 마커 표시
      const trip = tripsCache[id];
      if (trip) {
        const color = driverColorMap[id] || DRIVER_COLORS[0];
        // 아직 그려지지 않은 경우(scheduled 등) → 그리기
        if (!driverPolylines[id]) {
          await drawDriverPolyline(id, trip.id, color);
        }
        highlightDriver(id);
        showDriverRouteMarkers(id);

        // 경로 전체가 보이도록 지도 범위 조정
        const plArray = driverPolylines[id];
        if (plArray && plArray.length > 0) {
          const bounds = new kakao.maps.LatLngBounds();
          let hasPoints = false;
          plArray.forEach(pl => {
            pl.getPath().forEach(p => { bounds.extend(p); hasPoints = true; });
          });
          if (hasPoints) map.setBounds(bounds, 80);
        }
      } else {
        resetPolylineHighlight();
        hideAllRouteMarkers();
      }

      // 우측 패널
      const driverCard = document.getElementById(`card-${id}`);
      const driverName = driverCard ? driverCard.querySelector('strong').innerText : id;
      document.getElementById('right-panel').style.display = 'flex';
      document.getElementById('detail-name').innerText = driverName;

      // 운행 정보 박스
      const tripInfoBox = document.getElementById('trip-info-box');
      const noTripBox   = document.getElementById('no-trip-box');
      if (trip) {
        tripInfoBox.style.display = 'block';
        noTripBox.style.display   = 'none';
        const statusMap  = { scheduled: '출발 대기', in_progress: '운행 중', completed: '완료', cancelled: '취소' };
        const statusColor = { scheduled: 'bg-orange', in_progress: 'bg-green', completed: '', cancelled: '' };
        document.getElementById('trip-status-badge').textContent  = statusMap[trip.status] || trip.status;
        document.getElementById('trip-status-badge').className     = `status-badge ${statusColor[trip.status] || ''}`;
        document.getElementById('trip-dest-info').textContent = trip.dest_name
          ? `목적지: ${trip.dest_name}`
          : `🏗️ 상차 ${trip.loading_count||0}건 / 📦 하차 ${trip.unloading_count||0}건`;
        tripInfoBox._tripId = trip.id;

        // ETA 표시 (운행 중일 때만)
        const etaRow = document.getElementById('trip-eta-row');
        const etaDate = calcETADate(trip);
        if (etaDate) {
          const diffMin = Math.round((etaDate - Date.now()) / 60000);
          document.getElementById('trip-eta-time').textContent = formatTime(etaDate);
          document.getElementById('trip-eta-remain').textContent =
            diffMin >= 0 ? `(약 ${diffMin}분 남음)` : `(${Math.abs(diffMin)}분 초과)`;
          document.getElementById('trip-eta-remain').style.color = diffMin >= 0 ? '#888' : '#e74c3c';
          etaRow.style.display = 'block';
        } else {
          etaRow.style.display = 'none';
        }

        // 완료/취소된 운행은 버튼 숨기기
        const canAct = ['scheduled', 'in_progress'].includes(trip.status);
        document.getElementById('btn-trip-complete').style.display  = canAct ? 'block' : 'none';
        document.getElementById('btn-trip-cancel').style.display    = canAct ? 'block' : 'none';
        document.getElementById('btn-trip-reassign').style.display  = canAct ? 'block' : 'none';

        // 취소 요청 notice 박스
        const cancelBox = document.getElementById('cancel-request-box');
        if (trip.cancel_requested && canAct) {
          const reason = trip.cancel_request_reason || '사유 없음';
          document.getElementById('cancel-request-reason').textContent = `사유: ${reason}`;
          cancelBox.style.display = 'block';
        } else {
          cancelBox.style.display = 'none';
        }
      } else {
        tripInfoBox.style.display = 'none';
        noTripBox.style.display   = 'block';
      }

      renderRouteNodes(trip);
      renderNewTripSection(trip);
    }

    // 구간 출발 노드 타입에 따른 색상 결정
    // 폴리라인 좌표 배열에서 (lat, lon)에 가장 가까운 인덱스 반환
    function _findNearestIdx(polyline, lat, lon) {
      let best = 0, min = Infinity;
      for (let i = 0; i < polyline.length; i++) {
        const d = (polyline[i].lat - lat) ** 2 + (polyline[i].lon - lon) ** 2;
        if (d < min) { min = d; best = i; }
      }
      return best;
    }

    // 현재 위치 기준으로 passed/remaining setPath 갱신
    function splitPolylineAtPosition(driverId, lat, lon) {
      const points = driverPolylinePoints[driverId];
      const pls    = driverPolylines[driverId];
      if (!points || !pls || pls.length < 2) return;

      const idx     = _findNearestIdx(points, lat, lon);
      const allPath = points.map(p => new kakao.maps.LatLng(p.lat, p.lon));
      const passed  = allPath.slice(0, idx + 1);
      const remain  = allPath.slice(idx);

      if (passed.length > 1) pls[0].setPath(passed);
      if (remain.length > 1) pls[1].setPath(remain);
    }

    // 특정 기사의 경로선 + 노드 마커 제거
    function clearDriverRoute(driverId) {
      hideNodePopup();
      (driverPolylines[driverId] || []).forEach(pl => pl.setMap(null));
      delete driverPolylines[driverId];
      delete driverPolylinePoints[driverId];
      (driverRouteMarkers[driverId] || []).forEach(m => m.setMap(null));
      delete driverRouteMarkers[driverId];
    }

    // 전체 경로선 + 노드 마커 제거
    function clearAllRoutes() {
      hideNodePopup();
      Object.values(driverPolylines).forEach(pls => pls.forEach(pl => pl.setMap(null)));
      driverPolylines      = {};
      driverPolylinePoints = {};
      Object.values(driverRouteMarkers).forEach(arr => arr.forEach(m => m.setMap(null)));
      driverRouteMarkers = {};
    }

    // 선택된 기사 폴리라인 강조, 나머지 dim
    function highlightDriver(driverId) {
      Object.entries(driverPolylines).forEach(([id, pls]) => {
        const focused = id === driverId;
        if (pls[0]) pls[0].setOptions({ strokeWeight: focused ? 4 : 2,  strokeOpacity: focused ? 0.3  : 0.1  });
        if (pls[1]) pls[1].setOptions({ strokeWeight: focused ? 6 : 3,  strokeOpacity: focused ? 1.0  : 0.2  });
      });
    }

    // 모든 폴리라인 동등하게 표시 (선택 해제 시)
    function resetPolylineHighlight() {
      Object.values(driverPolylines).forEach(pls => {
        if (pls[0]) pls[0].setOptions({ strokeWeight: 4, strokeOpacity: 0.25 });
        if (pls[1]) pls[1].setOptions({ strokeWeight: 5, strokeOpacity: 0.85 });
      });
    }

    // 기사별 경로선 + 노드 마커 그리기
    async function drawDriverPolyline(driverId, tripId, color) {
      clearDriverRoute(driverId);

      const res = await fetch(`${API}/trips/${tripId}/polyline`, { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();

      if (data.polyline && data.polyline.length > 1) {
        driverPolylinePoints[driverId] = data.polyline;

        // 현재 위치로 지나온 구간 계산
        let splitIdx = 0;
        try {
          const locRes = await fetch(`${API}/location-logs/${driverId}`, { headers: authHeaders() });
          if (locRes.ok) {
            const loc = await locRes.json();
            splitIdx = _findNearestIdx(data.polyline, loc.lat, loc.lon);
          }
        } catch (e) {}

        const allPath   = data.polyline.map(p => new kakao.maps.LatLng(p.lat, p.lon));
        const passed    = allPath.slice(0, splitIdx + 1);
        const remaining = allPath.slice(splitIdx);

        const passedPl = new kakao.maps.Polyline({
          path: passed.length > 1 ? passed : allPath.slice(0, 1),
          strokeWeight: 4, strokeColor: color, strokeOpacity: 0.25,
          strokeStyle: 'solid', map,
        });
        const remainingPl = new kakao.maps.Polyline({
          path: remaining.length > 1 ? remaining : allPath,
          strokeWeight: 5, strokeColor: color, strokeOpacity: 0.85,
          strokeStyle: 'solid', map,
        });
        const onPlClick = () => { _polylineClicked = true; showDriverDetail(driverId); };
        kakao.maps.event.addListener(passedPl,    'click', onPlClick);
        kakao.maps.event.addListener(remainingPl, 'click', onPlClick);
        driverPolylines[driverId] = [passedPl, remainingPl];
      } else {
        driverPolylines[driverId] = [];
      }

      // 노드 마커는 driverRouteMarkers에 저장만 (표시는 showDriverRouteMarkers로 제어)
      driverRouteMarkers[driverId] = [];
      if (data.nodes) {
        data.nodes.forEach(node => {
          const icons = {
            origin:      { content: '🏁', color: '#27ae60' },
            destination: { content: '🏴', color: '#e74c3c' },
            rest_stop:   { content: '☕', color: '#8e44ad' },
          };
          const ic = node.type === 'waypoint'
            ? (node.node_type === 'loading'
                ? { content: '🏗️', color: '#e67e22' }
                : { content: '📦', color: '#2980b9' })
            : (icons[node.type] || { content: '📍', color: '#333' });

          const el = document.createElement('div');
          el.title = node.name;
          el.style.cssText = `
            position: relative; width: 36px; height: 36px; cursor: pointer;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            background: ${ic.color}; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
          `;
          const inner = document.createElement('div');
          inner.style.cssText = `
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transform: rotate(45deg); font-size: 18px;
          `;
          inner.textContent = ic.content;
          el.appendChild(inner);
          el.addEventListener('mousedown', e => e.stopPropagation());
          el.addEventListener('click', e => {
            e.stopPropagation();
            showNodePopup(node, e.clientX, e.clientY);
          });

          const overlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(node.lat, node.lon),
            content:  el,
            yAnchor:  1.2,
            zIndex:   5,
            // map은 여기서 설정 안 함 — showDriverRouteMarkers로 on/off
          });
          driverRouteMarkers[driverId].push(overlay);
        });
      }
    }

    // 특정 기사의 노드 마커 지도에 표시
    function showDriverRouteMarkers(driverId) {
      hideAllRouteMarkers();
      (driverRouteMarkers[driverId] || []).forEach(m => m.setMap(map));
    }

    // 모든 노드 마커 숨김
    function hideAllRouteMarkers() {
      Object.values(driverRouteMarkers).forEach(arr => arr.forEach(m => m.setMap(null)));
    }

    function hideRightPanel() {
      document.getElementById('right-panel').style.display = 'none';
      document.getElementById('route-nodes-box').style.display = 'none';
      document.getElementById('new-trip-section').style.display = 'none';
      currentDriverId = null;
      hideNodePopup();
      hideAllRouteMarkers();
      resetPolylineHighlight();
      document.querySelectorAll('.driver-card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.custom-app-marker').forEach(m => m.classList.remove('active'));
    }

    function renderRouteNodes(trip) {
      const box  = document.getElementById('route-nodes-box');
      const list = document.getElementById('route-nodes-list');

      if (!trip) { box.style.display = 'none'; return; }
      box.style.display = 'block';

      const nodeIcons = {
        origin:      { icon: '🏁', color: '#27ae60', label: '출발지' },
        waypoint:    { icon: '📦', color: '#e67e22', label: '경유' },
        rest_stop:   { icon: '☕', color: '#8e44ad', label: '휴게소' },
        destination: { icon: '🏴', color: '#e74c3c', label: '목적지' },
      };
      function _nodeIcon(n) {
        if (n.type === 'waypoint') {
          return n.node_type === 'loading'
            ? { icon: '🏗️', color: '#e67e22', label: '상차지' }
            : { icon: '📦', color: '#2980b9', label: '하차지' };
        }
        return nodeIcons[n.type] || { icon: '📍', color: '#555', label: '' };
      }

      let nodes = [];
      if (trip.optimized_route?.route) {
        nodes = trip.optimized_route.route;
      } else {
        const wpNodes = (trip.waypoints || []).map(w => ({
          type: 'waypoint', node_type: w.type || 'unloading',
          name: w.name, lat: w.lat, lon: w.lon,
        }));
        nodes = trip.dest_name
          ? [...wpNodes, { type: 'destination', name: trip.dest_name }]
          : wpNodes;
      }

      if (nodes.length === 0) {
        list.innerHTML = '<p style="color:gray; font-size:13px; text-align:center; padding:10px;">경로 정보 없음</p>';
        return;
      }

      const isRunning = trip.status === 'in_progress';
      const points    = isRunning ? (driverPolylinePoints[currentDriverId] || null) : null;
      const nodeRatios  = getNodeRatios(nodes, points);
      const driverRatio = isRunning ? getDriverRatio(currentDriverId) : -1;

      // 인디케이터가 속한 구간 (segment index, 0 = 노드0~노드1 사이)
      let indSeg = -1, indPct = 0;
      if (driverRatio >= 0) {
        for (let i = 0; i < nodes.length - 1; i++) {
          const r0 = nodeRatios[i] >= 0 ? nodeRatios[i] : 0;
          const r1 = nodeRatios[i + 1] >= 0 ? nodeRatios[i + 1] : 1;
          if (driverRatio >= r0 && driverRatio <= r1) {
            indSeg = i;
            indPct = r1 > r0 ? (driverRatio - r0) / (r1 - r0) : 0;
            break;
          }
        }
        // 마지막 노드 이후면 마지막 구간 끝에 표시
        if (indSeg < 0) { indSeg = nodes.length - 2; indPct = 1; }
      }

      // connector 높이: 실제 거리 비율을 반영하되 min/max 제한
      const SCALE = 400;
      function connH(i) {
        const r0 = nodeRatios[i] >= 0 ? nodeRatios[i] : 0;
        const r1 = nodeRatios[i + 1] >= 0 ? nodeRatios[i + 1] : 1;
        return Math.max(44, Math.min(140, (r1 - r0) * SCALE));
      }

      const scrollTop = list.scrollTop;
      let html = '';

      nodes.forEach((n, i) => {
        const meta   = _nodeIcon(n);
        const isDone = driverRatio >= 0 && nodeRatios[i] >= 0 && driverRatio > nodeRatios[i];
        const rest   = n.min_rest_minutes
          ? `<span style="font-size:11px; color:#8e44ad; margin-left:6px;">(${n.min_rest_minutes}분 휴식)</span>` : '';

        const dotBg     = isDone ? meta.color : '#fff';
        const dotBorder = isDone ? meta.color : '#d0d0d0';
        const textOpacity = isDone ? '0.45' : '1';

        html += `
          <div style="display:flex; align-items:center; gap:10px; position:relative; z-index:2;">
            <div style="width:32px; height:32px; border-radius:50%;
                        background:${dotBg}; border:2px solid ${dotBorder};
                        display:flex; align-items:center; justify-content:center;
                        font-size:${isDone ? '14' : '16'}px; flex-shrink:0;
                        box-shadow:${isDone ? '0 0 0 3px ' + meta.color + '28' : 'none'};">
              ${isDone ? '✓' : meta.icon}
            </div>
            <div style="opacity:${textOpacity};">
              <div style="font-size:14px; font-weight:600; color:#333;">${n.name}${rest}</div>
              <div style="font-size:11px; color:#aaa;">${meta.label}</div>
            </div>
          </div>`;

        // 노드 사이 connector (마지막 제외)
        if (i < nodes.length - 1) {
          const h          = connH(i);
          const lineColor  = isDone ? meta.color + 'aa' : '#e0e0e0';
          const hasInd     = isRunning && indSeg === i;
          const indTop     = Math.round(indPct * h);

          html += `
            <div style="position:relative; height:${h}px; margin-left:15px; margin-right:auto;">
              <div style="position:absolute; left:0; top:0; bottom:0; width:2px;
                          background:${lineColor}; border-radius:1px;"></div>
              ${hasInd ? `
              <div style="position:absolute; top:${indTop}px; left:-13px;
                          transform:translateY(-50%); font-size:22px; z-index:10;
                          filter:drop-shadow(0 1px 4px rgba(0,0,0,0.35));">🚚</div>` : ''}
            </div>`;
        }
      });

      list.innerHTML = html;
      list.scrollTop = scrollTop;
    }

    // GPS 갱신마다 진행도 인디케이터만 업데이트
    function updateProgressIndicator(driverId) {
      if (!currentDriverId || driverId !== currentDriverId) return;
      const trip = tripsCache[currentDriverId];
      if (!trip || trip.status !== 'in_progress') return;
      renderRouteNodes(trip);
    }

    async function renderNewTripSection(trip) {
      const section = document.getElementById('new-trip-section');
      if (!section) return;
      const hasActiveTrip = trip && ['scheduled', 'in_progress'].includes(trip.status);
      if (hasActiveTrip) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      await refreshVehicleSelect();
      renderTbTasks();
    }


    async function deleteDelivery(deliveryId) {
      if(!confirm('이 배차를 삭제하시겠습니까?')) return;
      await fetch(`${API}/deliveries/${deliveryId}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      await loadDrivers();
      showDriverDetail(currentDriverId);
    }

    // ── 기업명 표시 ───────────────────────────────────
    async function loadOrgName() {
      try {
        const res = await fetch(`${API}/organizations/me`, { headers: authHeaders() });
        if (!res.ok) return;
        const org = await res.json();
        const titleEl = document.querySelector('.title-text');
        if (titleEl && org.name) titleEl.textContent = org.name;
      } catch(e) {}
    }

    function logout() {
      if(confirm('정말 로그아웃 하시겠습니까?')) {
        localStorage.clear();
        window.location.href = '/login.html';
      }
    }

    // ── 운행 생성 모달 ──────────────────────────────
    // ════════════════════════════════════════════════
    // 운행 생성 패널 (Trip Builder)
    // ════════════════════════════════════════════════
    let tbTasks = [];  // [{loading:{name,lat,lon}|null, unloadings:[{name,lat,lon},...]}]
    let _searchPinOverlay = null;
    let _searchPinCoord   = null;

    async function initTripBuilder() {
      await refreshVehicleSelect();
      await refreshPresetSelect();
      renderTbTasks();
    }

    // ── 프리셋 ──────────────────────────────────────
    let _presets = [];

    async function refreshPresetSelect() {
      try {
        const res = await fetch(`${API}/presets`, { headers: authHeaders() });
        _presets = res.ok ? await res.json() : [];
      } catch(e) { _presets = []; }
      const sel = document.getElementById('preset-select');
      if (!sel) return;
      sel.innerHTML = '<option value="">— 프리셋 선택 —</option>' +
        _presets.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    }

    function loadPreset() {
      const sel = document.getElementById('preset-select');
      const id = parseInt(sel.value);
      if (!id) return;
      const preset = _presets.find(p => p.id === id);
      if (!preset) return;
      // waypoints 배열을 태스크 단위로 변환 (loading → 새 태스크, unloading → 마지막 태스크에 추가)
      tbTasks = [];
      for (const w of preset.waypoints) {
        if (w.type === 'loading') {
          tbTasks.push({ loading: { name: w.name, lat: w.lat, lon: w.lon }, unloadings: [] });
        } else {
          if (tbTasks.length === 0) tbTasks.push({ loading: null, unloadings: [] });
          tbTasks[tbTasks.length - 1].unloadings.push({ name: w.name, lat: w.lat, lon: w.lon });
        }
      }
      renderTbTasks();
    }

    async function savePreset() {
      const waypoints = _tbTasksToWaypoints();
      if (waypoints.length === 0) return alert('저장할 경유지가 없습니다.');
      const name = prompt('프리셋 이름을 입력하세요:');
      if (!name || !name.trim()) return;
      const res = await fetch(`${API}/presets`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ name: name.trim(), waypoints }),
      });
      if (!res.ok) { const e = await res.json(); return alert(`저장 실패: ${e.detail}`); }
      await refreshPresetSelect();
      alert('✅ 프리셋이 저장됐습니다.');
    }

    async function deletePreset() {
      const sel = document.getElementById('preset-select');
      const id = parseInt(sel.value);
      if (!id) return alert('삭제할 프리셋을 선택하세요.');
      const preset = _presets.find(p => p.id === id);
      if (!confirm(`"${preset?.name}" 프리셋을 삭제할까요?`)) return;
      const res = await fetch(`${API}/presets/${id}`, { method: 'DELETE', headers: authHeaders() });
      if (!res.ok) return alert('삭제 실패');
      await refreshPresetSelect();
    }

    async function refreshVehicleSelect() {
      const vehicleSel = document.getElementById('rp-vehicle');
      if (!vehicleSel) return;
      vehicleSel.innerHTML = '<option value="">차량 선택</option>';
      try {
        const vRes = await fetch(`${API}/vehicles`, { headers: authHeaders() });
        const vehicles = vRes.ok ? await vRes.json() : [];
        vehicles.forEach(v => {
          vehicleSel.innerHTML += `<option value="${v.id}">${v.plate_number} (${v.vehicle_type})</option>`;
        });
      } catch(e) {}
    }

    function _tbTasksToWaypoints() {
      const wps = [];
      tbTasks.forEach((task, ti) => {
        if (task.loading) wps.push({ ...task.loading, type: 'loading',   task_group: ti });
        for (const u of task.unloadings) {
          if (u) wps.push({ ...u,          type: 'unloading', task_group: ti });
        }
      });
      return wps;
    }

    function tbAddTask(loading = null) {
      tbTasks.push({ loading, unloadings: [] });
      renderTbTasks();
      // 새 태스크의 상차지 입력에 포커스
      const idx = tbTasks.length - 1;
      setTimeout(() => {
        const inp = document.getElementById(`tb-t${idx}-loading-inp`);
        if (inp) inp.focus();
      }, 50);
    }

    function tbRemoveTask(idx) {
      tbTasks.splice(idx, 1);
      renderTbTasks();
    }

    function tbAddUnloadingSlot(taskIdx) {
      tbTasks[taskIdx].unloadings.push(null);
      renderTbTasks();
      const idx = tbTasks[taskIdx].unloadings.length - 1;
      setTimeout(() => {
        const inp = document.getElementById(`tb-t${taskIdx}-ul${idx}-inp`);
        if (inp) inp.focus();
      }, 50);
    }

    function tbRemoveUnloadingSlot(taskIdx, ulIdx) {
      tbTasks[taskIdx].unloadings.splice(ulIdx, 1);
      renderTbTasks();
    }

    // Kakao Places 자동완성 (태스크 카드 내)
    function tbSearch(e, inputId, type, taskIdx, ulIdx) {
      const q = e.target.value.trim();
      const dropId = inputId + '-drop';
      const drop = document.getElementById(dropId);
      if (!drop) return;
      clearTimeout(_acDebounce[inputId]);
      if (q.length < 2) { drop.style.display = 'none'; return; }
      _acDebounce[inputId] = setTimeout(() => {
        const ps = new kakao.maps.services.Places();
        ps.keywordSearch(q, (data, status) => {
          if (status !== kakao.maps.services.Status.OK || !data.length) {
            drop.style.display = 'none'; return;
          }
          _acResults[inputId] = data.slice(0, 5).map(p => ({
            name: p.place_name,
            addr: p.road_address_name || p.address_name,
            lat:  parseFloat(p.y),
            lon:  parseFloat(p.x),
          }));
          drop.innerHTML = _acResults[inputId].map((r, i) => `
            <div class="ac-item" onclick="tbSelectLoc('${inputId}',${i},${taskIdx},'${type}',${ulIdx ?? -1})">
              <div class="ac-item-name">${escapeHtml(r.name)}</div>
              <div class="ac-item-addr">${escapeHtml(r.addr)}</div>
            </div>`).join('');
          drop.style.display = 'block';
        });
      }, 280);
    }

    function tbSelectLoc(inputId, resultIdx, taskIdx, type, ulIdx) {
      const r = (_acResults[inputId] || [])[resultIdx];
      if (!r) return;
      const inp = document.getElementById(inputId + '-inp');
      if (inp) inp.value = r.name;
      document.getElementById(inputId + '-drop').style.display = 'none';
      if (type === 'loading') {
        tbTasks[taskIdx].loading = { name: r.name, lat: r.lat, lon: r.lon };
      } else {
        tbTasks[taskIdx].unloadings[ulIdx] = { name: r.name, lat: r.lat, lon: r.lon };
      }
    }

    function renderTbTasks() {
      const el = document.getElementById('rp-tasks-list');
      if (!el) return;
      if (tbTasks.length === 0) {
        el.innerHTML = '<div style="font-size:12px; color:#ccc; padding:4px 0; text-align:center;">태스크가 없습니다. 지도를 클릭하거나 + 태스크 추가를 눌러주세요.</div>';
        return;
      }
      el.innerHTML = tbTasks.map((task, ti) => {
        const loadingVal = task.loading ? task.loading.name : '';
        const ulRows = task.unloadings.map((u, ui) => `
          <div class="tb-ul-row">
            <span style="font-size:11px; color:#2980b9; flex-shrink:0;">📦</span>
            <div class="tb-task-field" style="flex:1; margin:0;">
              <input id="tb-t${ti}-ul${ui}-inp" class="tb-task-input" style="border-color:#d1ecf1;"
                placeholder="하차지 검색..." value="${escapeHtml(u?.name || '')}"
                oninput="tbSearch(event,'tb-t${ti}-ul${ui}','unloading',${ti},${ui})">
              <div id="tb-t${ti}-ul${ui}-drop" class="ac-dropdown"></div>
            </div>
            <button onclick="tbRemoveUnloadingSlot(${ti},${ui})" style="background:none;border:none;cursor:pointer;color:#e74c3c;font-size:14px;padding:0 2px;flex-shrink:0;">✕</button>
          </div>`).join('');
        return `
          <div class="tb-task-card">
            <div class="tb-task-header">
              <span>태스크 ${ti + 1}</span>
              <button onclick="tbRemoveTask(${ti})" style="background:none;border:none;cursor:pointer;color:#e74c3c;font-size:13px;padding:0;">✕ 제거</button>
            </div>
            <div style="display:flex; align-items:center; gap:4px; margin-bottom:6px;">
              <span style="font-size:11px; color:#e67e22; flex-shrink:0;">🏗️</span>
              <div class="tb-task-field" style="flex:1; margin:0;">
                <input id="tb-t${ti}-loading-inp" class="tb-task-input" style="border-color:#fff3cd;"
                  placeholder="상차지 검색..." value="${escapeHtml(loadingVal)}"
                  oninput="tbSearch(event,'tb-t${ti}-loading','loading',${ti})">
                <div id="tb-t${ti}-loading-drop" class="ac-dropdown"></div>
              </div>
            </div>
            ${ulRows}
            <button onclick="tbAddUnloadingSlot(${ti})"
              style="width:100%;padding:4px;background:#f0f8ff;border:1px dashed #2980b9;border-radius:6px;font-size:11px;color:#2980b9;cursor:pointer;margin-top:2px;">
              + 하차지 추가
            </button>
          </div>`;
      }).join('');
    }

    function resetTripBuilder() {
      tbTasks = [];
      renderTbTasks();
      const dep = document.getElementById('rp-departure');
      if (dep) dep.value = '';
    }

    async function createTripFromMap() {
      const vehicleId = document.getElementById('rp-vehicle').value;
      const departure = document.getElementById('rp-departure').value;

      if (!currentDriverId) return alert('좌측 패널에서 기사를 먼저 선택하세요.');
      if (!vehicleId)        return alert('차량을 선택하세요.');
      if (tbTasks.length === 0) return alert('태스크를 1개 이상 추가하세요.');
      const incomplete = tbTasks.findIndex(t => !t.loading);
      if (incomplete !== -1) return alert(`태스크 ${incomplete + 1}의 상차지를 입력해주세요.`);

      const waypoints = _tbTasksToWaypoints();

      const body = {
        driver_id:  currentDriverId,
        vehicle_id: parseInt(vehicleId),
        waypoints,
      };
      if (departure) body.departure_time = new Date(departure).toISOString();

      const res = await fetch(`${API}/trips`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json();
        return alert(`운행 생성 실패: ${err.detail}`);
      }

      alert('✅ 운행이 생성됐습니다!');
      resetTripBuilder();
      await loadDrivers();
      await showDriverDetail(currentDriverId);
    }

    // ════════════════════════════════════════════════
    // 지도 상단 검색바
    // ════════════════════════════════════════════════
    function initMapSearch() {
      const input    = document.getElementById('map-search-input');
      const dropdown = document.getElementById('ac-map-search');
      if (!input) return;

      input.addEventListener('input', () => {
        clearTimeout(_acDebounce['map-search']);
        const q = input.value.trim();
        if (q.length < 2) { dropdown.style.display = 'none'; return; }
        _acDebounce['map-search'] = setTimeout(() => {
          const ps = new kakao.maps.services.Places();
          ps.keywordSearch(q, (data, status) => {
            if (status !== kakao.maps.services.Status.OK || !data.length) {
              dropdown.style.display = 'none';
              return;
            }
            _acResults['map-search'] = data.slice(0, 6).map(p => ({
              name:     p.place_name,
              addr:     p.road_address_name || p.address_name,
              lat:      parseFloat(p.y),
              lon:      parseFloat(p.x),
              phone:    p.phone    || '',
              category: p.category_name || '',
              placeUrl: p.place_url || '',
            }));
            dropdown.innerHTML = _acResults['map-search'].map((r, i) => `
              <div class="ac-item" data-idx="${i}">
                <div class="ac-item-name">${escapeHtml(r.name)}</div>
                <div class="ac-item-addr">${escapeHtml(r.addr)}</div>
              </div>
            `).join('');
            dropdown.style.display = 'block';

            dropdown.querySelectorAll('.ac-item').forEach(item => {
              item.addEventListener('mousedown', e => {
                e.preventDefault();
                const r = _acResults['map-search'][parseInt(item.dataset.idx)];
                input.value = r.name;
                dropdown.style.display = 'none';
                showSearchPin(r.lat, r.lon, r.name, r.addr,
                  { phone: r.phone, category: r.category, placeUrl: r.placeUrl });
              });
            });
          });
        }, 300);
      });
      input.addEventListener('blur', () => {
        setTimeout(() => { dropdown.style.display = 'none'; }, 180);
      });
    }

    function showSearchPin(lat, lon, name, addr, info = {}) {
      if (_searchPinOverlay) { _searchPinOverlay.setMap(null); _searchPinOverlay = null; }

      const { phone = '', category = '', placeUrl = '' } = info;
      _searchPinCoord = { lat, lon, name: name || addr, addr, phone, category, placeUrl };
      map.panTo(new kakao.maps.LatLng(lat, lon));

      const activeTrip = currentDriverId && tripsCache[currentDriverId] &&
        ['scheduled', 'in_progress'].includes(tripsCache[currentDriverId].status);

      // 카테고리 최하위 분류만 표시 (예: "음식점 > 한식" → "한식")
      const catShort = category ? category.split(' > ').pop() : '';

      const el = document.createElement('div');
      el.className = 'search-pin-popup';
      el.innerHTML = `
        <div class="pin-body">
          <button class="pin-close-btn" onclick="hideSearchPin()" title="닫기">✕</button>
          ${catShort ? `<div class="pin-category">${escapeHtml(catShort)}</div>` : ''}
          <div class="pin-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
          ${addr && addr !== name ? `<div class="pin-info-row">📍 ${escapeHtml(addr)}</div>` : ''}
          ${phone ? `<div class="pin-info-row">📞 ${escapeHtml(phone)}</div>` : ''}
          ${placeUrl ? `<a class="pin-kakao-link" href="${escapeHtml(placeUrl)}" target="_blank" rel="noopener">카카오맵에서 보기 →</a>` : ''}
          <hr class="pin-divider">
          <div class="pin-btns">
            <button class="pin-btn" style="background:#fff3cd; color:#e67e22;" onclick="useSearchPin('loading')">🏗️ 상차지</button>
            <button class="pin-btn" style="background:#d1ecf1; color:#2980b9;" onclick="useSearchPin('unloading')">📦 하차지</button>
          </div>
          ${activeTrip ? `<div class="pin-btns-emergency">
            <button class="pin-btn-emergency" onclick="addEmergencyWaypoint('loading')">⚡ 긴급 상차지</button>
            <button class="pin-btn-emergency" onclick="addEmergencyWaypoint('unloading')">⚡ 긴급 하차지</button>
          </div>` : ''}
        </div>
        <div class="pin-tail"></div>
      `;
      el.addEventListener('mousedown', e => e.stopPropagation());
      el.addEventListener('click',     e => e.stopPropagation());

      _searchPinOverlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(lat, lon),
        content:  el,
        map,
        yAnchor: 1.06,
        zIndex:  20,
      });
    }

    function hideSearchPin() {
      if (_searchPinOverlay) { _searchPinOverlay.setMap(null); _searchPinOverlay = null; }
      _searchPinCoord = null;
    }

    function useSearchPin(type) {
      if (!_searchPinCoord) return;
      const { name, lat, lon } = _searchPinCoord;
      if (type === 'loading') {
        // 새 태스크 시작 — 상차지로 설정
        tbAddTask({ name, lat, lon });
      } else {
        // 마지막 태스크에 하차지 추가 (없으면 태스크 먼저 만들라고 안내)
        if (tbTasks.length === 0) {
          alert('먼저 상차지를 추가해주세요.');
          return;
        }
        tbTasks[tbTasks.length - 1].unloadings.push({ name, lat, lon });
        renderTbTasks();
      }
      if (_searchPinOverlay) { _searchPinOverlay.setMap(null); _searchPinOverlay = null; }
      document.getElementById('map-search-input').value = '';
    }

    async function addEmergencyWaypoint(type = 'unloading') {
      if (!_searchPinCoord || !currentDriverId) return;
      const { name, lat, lon } = _searchPinCoord;

      const trip = tripsCache[currentDriverId];
      if (!trip || !['scheduled', 'in_progress'].includes(trip.status)) {
        return alert('활성 운행이 없습니다.');
      }

      const res = await fetch(`${API}/trips/${trip.id}/waypoints`, {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({ name, lat, lon, type }),
      });

      if (_searchPinOverlay) { _searchPinOverlay.setMap(null); _searchPinOverlay = null; }

      if (!res.ok) {
        const err = await res.json();
        return alert(`경유지 추가 실패: ${err.detail}`);
      }

      const typeLabel = type === 'loading' ? '상차지' : '하차지';
      alert(`✅ '${name}' ${typeLabel}가 긴급 추가됐습니다.\n기사 앱에 재경로 요청을 전송했습니다.`);
      await loadDrivers();
      await showDriverDetail(currentDriverId);
    }

    // ── 배차 취소 요청 승인/거절 ──────────────────────
    async function respondCancelRequest(action) {
      const tripId = document.getElementById('trip-info-box')._tripId;
      if (!tripId) return;
      const label = action === 'approve' ? '취소 승인' : '거절';
      if (!confirm(`기사의 배차 취소 요청을 ${label} 처리하시겠습니까?`)) return;
      const res = await fetch(`${API}/trips/${tripId}/cancel-request/respond?action=${action}`, {
        method: 'POST', headers: authHeaders(),
      });
      if (!res.ok) { const e = await res.json(); return alert(`처리 실패: ${e.detail}`); }
      if (action === 'approve') clearDriverRoute(currentDriverId);
      await loadDrivers();
      await showDriverDetail(currentDriverId);
    }

    // ── 운행 완료/취소 ──────────────────────────────
    async function completeTripCurrent() {
      const tripId = document.getElementById('trip-info-box')._tripId;
      if (!tripId || !confirm('이 운행을 완료 처리하시겠습니까?')) return;
      const res = await fetch(`${API}/trips/${tripId}/status?status=completed`, {
        method: 'PATCH', headers: authHeaders()
      });
      if (!res.ok) return alert('처리 실패');
      clearDriverRoute(currentDriverId);
      alert('✅ 운행이 완료 처리됐습니다.');
      await loadDrivers();
      await showDriverDetail(currentDriverId);
    }

    async function cancelTripCurrent() {
      const tripId = document.getElementById('trip-info-box')._tripId;
      if (!tripId || !confirm('이 운행을 취소하시겠습니까?')) return;
      const res = await fetch(`${API}/trips/${tripId}/status?status=cancelled`, {
        method: 'PATCH', headers: authHeaders()
      });
      if (!res.ok) return alert('처리 실패');
      clearDriverRoute(currentDriverId);
      alert('운행이 취소됐습니다.');
      await loadDrivers();
      await showDriverDetail(currentDriverId);
    }

    window.onload = async () => {
      // 1. 서버에서 카카오 JS 키 조회
      let kakaoKey;
      try {
        const res = await fetch(`${API}/config`);
        if (!res.ok) throw new Error();
        const cfg = await res.json();
        kakaoKey = cfg.kakao_js_key;
      } catch(e) {
        alert('지도 키 로드 실패. 백엔드 서버와 KAKAO_JS_KEY 환경변수를 확인해주세요.');
        return;
      }

      // 2. autoload=false로 SDK 동적 로드 (document.write 없이)
      const script = document.createElement('script');
      script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoKey}&autoload=false&libraries=services`;
      script.onload = () => {
        // 3. kakao.maps.load() 콜백에서 지도 초기화
        kakao.maps.load(() => {
          initMap();
          initMapSearch();
          loadDrivers().then(async () => {
            // 초기 로드: 모든 기사의 마지막 위치 조회 → 마커 생성
            await Promise.all(driversCache.map(async d => {
              try {
                const r = await fetch(`${API}/location-logs/${d.id}`, { headers: authHeaders() });
                if (r.ok) {
                  const loc = await r.json();
                  updateDriverMarker({ user_id: d.id, lat: loc.lat, lon: loc.lon });
                }
              } catch(e) {}
            }));

            const sel = new URLSearchParams(location.search).get('select_driver');
            if (sel) {
              showDriverDetail(sel);
              setTimeout(() => {
                const card = document.getElementById(`card-${sel}`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }, 300);
            }
          });
          document.addEventListener('keydown', e => {
            if (e.key === 'Escape') hideSearchPin();
          });
          connectLocationWebSocket();
          connectChatWebSocket();
          loadOrgName();

          // ETA 1분 주기 갱신
          setInterval(() => {
            if (currentDriverId) {
              const trip = tripsCache[currentDriverId];
              const etaRow = document.getElementById('trip-eta-row');
              const etaDate = calcETADate(trip);
              if (etaRow && etaDate) {
                const diffMin = Math.round((etaDate - Date.now()) / 60000);
                document.getElementById('trip-eta-time').textContent = formatTime(etaDate);
                document.getElementById('trip-eta-remain').textContent =
                  diffMin >= 0 ? `(약 ${diffMin}분 남음)` : `(${Math.abs(diffMin)}분 초과)`;
                document.getElementById('trip-eta-remain').style.color = diffMin >= 0 ? '#888' : '#e74c3c';
              }
            }
            // 기사 카드 ETA 갱신
            Object.entries(tripsCache).forEach(([drvId, trip]) => {
              const el = document.getElementById(`card-eta-${drvId}`);
              if (el && trip) el.textContent = formatCardETA(trip);
            });
          }, 60000);
        });
      };
      script.onerror = () => {
        alert('카카오 SDK 로드 실패. JS 키 또는 허용 도메인을 확인해주세요.');
      };
      document.head.appendChild(script);
    };

    // ────────────────────────────────────────────────
    // 채팅
    // ────────────────────────────────────────────────
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    async function loadChatConversations() {
      try {
        const res = await fetch(`${API}/chat/conversations`, { headers: authHeaders() });
        if (!res.ok) return;
        driverUnreadCounts = {};
        convDriverMap = {};
        (await res.json()).forEach(c => {
          driverUnreadCounts[c.driver_id] = c.unread_count || 0;
          convDriverMap[c.id] = c.driver_id;
        });
      } catch (e) {
        console.warn('채팅 목록 조회 실패:', e);
      }
    }

    // ────────────────────────────────────────────────
    // 채팅 WS — 새 메시지 알림 (경량, 수신 전용)
    // ────────────────────────────────────────────────
    let chatNotifyWs = null;
    let chatNotifyReconnectTimer = null;

    async function connectChatWebSocket() {
      if (!currentUserId) {
        try {
          const r = await fetch(`${API}/auth/me`, { headers: authHeaders() });
          if (r.ok) currentUserId = (await r.json()).id;
        } catch (_) {}
      }
      const token = encodeURIComponent(getToken());
      const WS_URL = `ws://168.138.45.63:8000/ws/chat?token=${token}`;
      chatNotifyWs = new WebSocket(WS_URL);

      chatNotifyWs.onopen = () => {
        clearTimeout(chatNotifyReconnectTimer);
      };

      chatNotifyWs.onmessage = (event) => {
        try {
          const ev = JSON.parse(event.data);
          if (ev.type === 'chat.message' && ev.message.sender_id !== currentUserId) {
            const cur = driverUnreadCounts[ev.driver_id] || 0;
            updateDriverUnreadBadge(ev.driver_id, cur + 1);
          } else if (ev.type === 'chat.read' && ev.reader_id === currentUserId) {
            const driverId = convDriverMap[ev.conversation_id];
            if (driverId) updateDriverUnreadBadge(driverId, 0);
          }
        } catch (_) {}
      };

      chatNotifyWs.onclose = () => {
        chatNotifyReconnectTimer = setTimeout(connectChatWebSocket, 5000);
      };

      chatNotifyWs.onerror = () => { chatNotifyWs.close(); };
    }

    // ════════════════════════════════════════════════
    // ① 자동완성
    // ════════════════════════════════════════════════
    // ════════════════════════════════════════════════
    // ④ 노드 클릭 → 상세 팝업
    // ════════════════════════════════════════════════
    function showNodePopup(node, x, y) {
      hideNodePopup();
      const labels = { origin: '출발지', waypoint: '경유지', rest_stop: '휴게소', destination: '목적지' };
      const icons  = { origin: '🏁', waypoint: '📦', rest_stop: '☕', destination: '🏴' };
      const el = document.createElement('div');
      el.className = 'node-popup';

      // 화면 오른쪽 가장자리 초과 방지
      const rightEdge = window.innerWidth - 230;
      el.style.left = Math.min(x + 12, rightEdge) + 'px';
      el.style.top  = (y - 10) + 'px';

      el.innerHTML = `
        <button class="node-popup-close" onclick="hideNodePopup()">×</button>
        <div class="node-popup-title">${icons[node.type] || '📍'} ${escapeHtml(node.name)}</div>
        <div class="node-popup-row">유형: ${labels[node.type] || node.type}</div>
        ${node.lat ? `<div class="node-popup-row">좌표: ${Number(node.lat).toFixed(4)}, ${Number(node.lon).toFixed(4)}</div>` : ''}
        ${node.min_rest_minutes ? `<div class="node-popup-row">휴식 시간: ${node.min_rest_minutes}분</div>` : ''}
      `;
      document.body.appendChild(el);
      _nodePopupEl = el;
    }

    function hideNodePopup() {
      if (_nodePopupEl) { _nodePopupEl.remove(); _nodePopupEl = null; }
    }

    function updateDriverUnreadBadge(driverId, unreadCount) {
      driverUnreadCounts[driverId] = unreadCount;
      const badge = document.getElementById(`chat-unread-${driverId}`);
      if (!badge) return;
      badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
      badge.style.display = unreadCount > 0 ? 'inline-block' : 'none';
    }

    // ────────────────────────────────────────────────
    // WebSocket — 실시간 기사 위치 수신
    // ────────────────────────────────────────────────
    let locationWs = null;
    let locationWsReconnectTimer = null;

    function connectLocationWebSocket() {
      const token = encodeURIComponent(getToken());
      const WS_URL = `ws://168.138.45.63:8000/ws/location?token=${token}`;
      locationWs = new WebSocket(WS_URL);

      locationWs.onopen = () => {
        console.log('[WS] 연결됨');
        // 30초마다 ping 전송 (연결 유지)
        clearInterval(locationWsReconnectTimer);
        locationWsReconnectTimer = setInterval(() => {
          if (locationWs.readyState === WebSocket.OPEN) {
            locationWs.send('ping');
          }
        }, 30000);
      };

      locationWs.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'trip.started') {
            handleTripStarted(data);
          } else if (data.type === 'trip.replanned') {
            handleTripReplanned(data);
          } else if (data.type === 'trip.cancel_requested') {
            handleCancelRequested(data);
          } else if (data.type === 'trip.cancel_responded') {
            handleCancelResponded(data);
          } else if (data.type === 'trip.reassigned') {
            handleTripReassigned(data);
          } else {
            updateDriverMarker(data);
          }
        } catch (e) {
          console.warn('[WS] 메시지 파싱 오류:', e);
        }
      };

      locationWs.onclose = () => {
        console.warn('[WS] 연결 끊김 — 5초 후 재연결');
        clearInterval(locationWsReconnectTimer);
        setTimeout(connectLocationWebSocket, 5000);
      };

      locationWs.onerror = (e) => {
        console.error('[WS] 오류:', e);
        locationWs.close();
      };
    }

    async function handleTripStarted(data) {
      const driverId = data.driver_id;
      await loadDrivers();
      if (currentDriverId === driverId) await showDriverDetail(driverId);
    }

    async function handleTripReplanned(data) {
      const driverId = data.driver_id;
      clearDriverRoute(driverId);
      await loadDrivers();
      if (currentDriverId === driverId) await showDriverDetail(driverId);
    }

    async function handleCancelRequested(data) {
      await loadDrivers();
      if (currentDriverId === data.driver_id) await showDriverDetail(data.driver_id);
    }

    async function handleCancelResponded(data) {
      if (data.action === 'approve') clearDriverRoute(data.driver_id);
      await loadDrivers();
      if (currentDriverId === data.driver_id) await showDriverDetail(data.driver_id);
    }

    function updateDriverMarker(data) {
      const { user_id, lat, lon } = data;
      if (!lat || !lon) return;

      // 현재 위치 저장 (진행도 계산용)
      driverCurrentPositions[user_id] = { lat, lon };

      const position = new kakao.maps.LatLng(lat, lon);

      if (!markers[user_id]) {
        // 처음 수신 — 드라이버 정보 로드 후 마커 생성
        fetch(`${API}/users?role=driver`, { headers: authHeaders() })
          .then(r => r.ok ? r.json() : null)
          .then(drivers => {
            const driver = Array.isArray(drivers) ? drivers.find(d => d.id === user_id) : null;
            const name = driver ? driver.username : user_id.slice(0, 6);
            const markerContent = createCustomMarkerElement(name, user_id);
            const overlay = new kakao.maps.CustomOverlay({
              position, content: markerContent, map, yAnchor: 1.15, zIndex: 10
            });
            markers[user_id] = overlay;
          })
          .catch(() => {
            // 드라이버 정보 없어도 마커는 생성
            const markerContent = createCustomMarkerElement(user_id.slice(0, 6), user_id);
            const overlay = new kakao.maps.CustomOverlay({
              position, content: markerContent, map, yAnchor: 1.15, zIndex: 10
            });
            markers[user_id] = overlay;
          });
      } else {
        // 기존 마커 위치 업데이트
        markers[user_id].setPosition(position);
      }

      // 폴리라인이 없는데 in_progress trip이 있으면 그리기 (WS 이벤트 누락 방지)
      if (!driverPolylines[user_id] && tripsCache[user_id]?.status === 'in_progress') {
        const trip  = tripsCache[user_id];
        const color = driverColorMap[user_id] || DRIVER_COLORS[0];
        drawDriverPolyline(user_id, trip.id, color);
      }

      // 폴리라인 지나온/남은 구간 갱신
      splitPolylineAtPosition(user_id, lat, lon);

      // 경로 진행도 인디케이터 갱신
      updateProgressIndicator(user_id);

      // 현재 선택된 기사면 지도도 이동
      if (currentDriverId === user_id) {
        map.panTo(position);
      }
    }
  </script>

  <!-- 자동 배차 모달 -->

        <!-- 차량 / 출발 시각 -->
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <div style="flex:1;">
            <div class="ad-field-label" style="color:#555;">차량 (선택)</div>

        <!-- 가용 기사 -->

        <div id="ad-driver-hint" style="font-size:11px; color:#999; margin-bottom:10px;">클릭해 배차 대상 기사를 선택/해제하세요. 체크 안 하면 전체 가용 기사에게 배분합니다.</div>

  <script>
    // ════════════════════════════════════════════════
    // 자동 배차 모달
    // ════════════════════════════════════════════════
    let adTasks = [];       // [{loading:{name,lat,lon}|null, unloadings:[{name,lat,lon},...]}]
    let adDrivers = [];     // GET /drivers/available 결과
    let adSelectedDriverIds = new Set();

    async function openAutoDispatchModal() {
      adTasks = [];
      adSelectedDriverIds = new Set();
      addAdTask();  // 기본 태스크 1개
      document.getElementById('ad-overlay').style.display = 'flex';

      // 차량 목록 로드
      const vSel = document.getElementById('ad-vehicle');
      vSel.innerHTML = '<option value="">— 선택 안 함 —</option>';
      try {
        const vRes = await fetch(`${API}/vehicles`, { headers: authHeaders() });
        const vehicles = vRes.ok ? await vRes.json() : [];
        vehicles.forEach(v => {
          vSel.innerHTML += `<option value="${v.id}">${v.plate_number} (${v.vehicle_type})</option>`;
        });
      } catch(e) {}

      // 가용 기사 로드
      await loadAdDrivers();
      renderAdDriverChips();
      updateAdPreview();
    }

    function closeAutoDispatchModal() {
      document.getElementById('ad-overlay').style.display = 'none';
    }

    async function loadAdDrivers() {
      try {
        const res = await fetch(`${API}/drivers/available`, { headers: authHeaders() });
        adDrivers = res.ok ? await res.json() : [];
      } catch(e) { adDrivers = []; }
      const cnt = adDrivers.filter(d => d.available).length;
      document.getElementById('ad-driver-count').textContent = `(가용 ${cnt}명 / 전체 ${adDrivers.length}명)`;
    }

    function renderAdDriverChips() {
      const el = document.getElementById('ad-driver-chips');
      if (!adDrivers.length) { el.innerHTML = '<span style="font-size:12px;color:#aaa;">기사가 없습니다.</span>'; return; }
      el.innerHTML = adDrivers.map(d => {
        const busy = !d.available;
        const sel  = adSelectedDriverIds.has(d.id);
        return `<span class="ad-driver-chip ${busy ? 'busy' : ''} ${sel ? 'selected' : ''}"
          onclick="${busy ? '' : `toggleAdDriver('${d.id}')`}">
          ${d.name}${busy ? ' (운행중)' : ''}
        </span>`;
      }).join('');
    }

    function toggleAdDriver(id) {
      if (adSelectedDriverIds.has(id)) adSelectedDriverIds.delete(id);
      else adSelectedDriverIds.add(id);
      renderAdDriverChips();
      updateAdPreview();
    }

    function updateAdPreview() {
      const box = document.getElementById('ad-preview');
      const taskCount = adTasks.length;
      const available = adDrivers.filter(d => d.available);
      const targetDrivers = adSelectedDriverIds.size > 0
        ? available.filter(d => adSelectedDriverIds.has(d.id))
        : available;
      const driverCount = targetDrivers.length;
      if (!taskCount || !driverCount) { box.style.display = 'none'; return; }
      const perDriver = Math.ceil(taskCount / driverCount);
      box.style.display = 'block';
      box.textContent = `태스크 ${taskCount}개 → 기사 ${driverCount}명에게 분배 (기사당 최대 ${perDriver}개)`;
    }

    function addAdTask() {
      adTasks.push({ loading: null, unloadings: [null] });
      renderAdTasks();
    }

    function removeAdTask(idx) {
      adTasks.splice(idx, 1);
      renderAdTasks();
      updateAdPreview();
    }

    function addAdUnloading(taskIdx) {
      adTasks[taskIdx].unloadings.push(null);
      renderAdTasks();
    }

    function removeAdUnloading(taskIdx, ulIdx) {
      adTasks[taskIdx].unloadings.splice(ulIdx, 1);
      if (!adTasks[taskIdx].unloadings.length) adTasks[taskIdx].unloadings.push(null);
      renderAdTasks();
    }

    function renderAdTasks() {
      const list = document.getElementById('ad-task-list');
      list.innerHTML = adTasks.map((task, ti) => `
        <div class="ad-task-card">
          <div class="ad-task-title">
            <span>태스크 ${ti + 1}</span>
            <button class="ad-task-remove" onclick="removeAdTask(${ti})">✕</button>
          </div>
          <div class="ad-field-label loading">🏗️ 상차지</div>
          <div class="ad-loc-row">
            <div class="ac-wrapper" style="flex:1;">
              <input id="ad-t${ti}-loading" type="text" placeholder="장소 검색..." autocomplete="off"
                value="${task.loading ? escapeHtml(task.loading.name) : ''}"
                oninput="adSearch(event,'t${ti}-loading','loading',${ti},-1)"
                onfocus="adSearch(event,'t${ti}-loading','loading',${ti},-1)">
              <div class="ac-dropdown" id="ac-ad-t${ti}-loading"></div>
            </div>
            <button class="ad-loc-clear" onclick="adClearLoc(${ti},'loading',-1)" title="지우기">✕</button>
          </div>
          <div class="ad-field-label unloading" style="margin-top:6px;">📦 하차지</div>
          ${task.unloadings.map((u, ui) => `
            <div class="ad-loc-row">
              <div class="ac-wrapper" style="flex:1;">
                <input id="ad-t${ti}-ul${ui}" type="text" placeholder="장소 검색..." autocomplete="off"
                  value="${u ? escapeHtml(u.name) : ''}"
                  oninput="adSearch(event,'t${ti}-ul${ui}','unloading',${ti},${ui})"
                  onfocus="adSearch(event,'t${ti}-ul${ui}','unloading',${ti},${ui})">
                <div class="ac-dropdown" id="ac-ad-t${ti}-ul${ui}"></div>
              </div>
              <button class="ad-loc-clear" onclick="adClearLoc(${ti},'unloading',${ui})" title="지우기">✕</button>
            </div>
          `).join('')}
          <button class="ad-add-unloading" onclick="addAdUnloading(${ti})">+ 하차지 추가</button>
        </div>
      `).join('');
      updateAdPreview();
    }

    function adClearLoc(taskIdx, type, ulIdx) {
      if (type === 'loading') {
        adTasks[taskIdx].loading = null;
        const inp = document.getElementById(`ad-t${taskIdx}-loading`);
        if (inp) inp.value = '';
      } else {
        adTasks[taskIdx].unloadings[ulIdx] = null;
        const inp = document.getElementById(`ad-t${taskIdx}-ul${ulIdx}`);
        if (inp) inp.value = '';
      }
    }

    function adSearch(e, inputKey, type, taskIdx, ulIdx) {
      const inputId = `ad-${inputKey}`;
      const dropId  = `ac-ad-${inputKey}`;
      const input   = document.getElementById(inputId);
      const drop    = document.getElementById(dropId);
      if (!input || !drop) return;
      clearTimeout(_acDebounce[inputId]);
      const q = input.value.trim();
      if (q.length < 1) { drop.style.display = 'none'; return; }
      _acDebounce[inputId] = setTimeout(() => {
        const ps = new kakao.maps.services.Places();
        ps.keywordSearch(q, (data, status) => {
          if (status !== kakao.maps.services.Status.OK || !data.length) {
            drop.style.display = 'none'; return;
          }
          _acResults[inputId] = data.slice(0, 6).map(p => ({
            name: p.place_name,
            addr: p.road_address_name || p.address_name,
            lat:  parseFloat(p.y),
            lon:  parseFloat(p.x),
          }));
          drop.innerHTML = _acResults[inputId].map((r, i) => `
            <div class="ac-item" onclick="adSelectLoc('${inputId}','${dropId}',${i},${taskIdx},'${type}',${ulIdx})">
              <div class="ac-item-name">${escapeHtml(r.name)}</div>
              <div class="ac-item-addr">${escapeHtml(r.addr)}</div>
            </div>`).join('');
          drop.style.display = 'block';
        });
      }, 280);
    }

    function adSelectLoc(inputId, dropId, resultIdx, taskIdx, type, ulIdx) {
      const r = (_acResults[inputId] || [])[resultIdx];
      if (!r) return;
      const inp = document.getElementById(inputId);
      const drop = document.getElementById(dropId);
      if (inp) inp.value = r.name;
      if (drop) drop.style.display = 'none';
      if (type === 'loading') {
        adTasks[taskIdx].loading = { name: r.name, lat: r.lat, lon: r.lon };
      } else {
        adTasks[taskIdx].unloadings[ulIdx] = { name: r.name, lat: r.lat, lon: r.lon };
      }
    }

    // 드롭다운 외부 클릭 시 닫기 (태스크 카드 + 자동배차 모달 내 ac-dropdown 포함)
    document.addEventListener('click', e => {
      document.querySelectorAll('.ac-dropdown').forEach(drop => {
        if (!drop.contains(e.target) && !drop.previousElementSibling?.contains(e.target)) {
          drop.style.display = 'none';
        }
      });
    });

    // ── 기사·차량 교체 ──────────────────────────────
    async function openReassignModal() {
      const tripId = document.getElementById('trip-info-box')._tripId;
      if (!tripId) return;
      const trip = tripsCache[currentDriverId];
      if (!trip) return;

      // 가용 기사 목록 로드 (현재 기사 포함 전체 → 선택 시 자신 제외 처리)
      const [driversRes, vehiclesRes] = await Promise.all([
        fetch(`${API}/drivers/available`, { headers: authHeaders() }),
        fetch(`${API}/vehicles`,           { headers: authHeaders() }),
      ]);
      const allDrivers  = driversRes.ok  ? await driversRes.json()  : [];
      const allVehicles = vehiclesRes.ok ? await vehiclesRes.json() : [];

      const driverOpts = allDrivers
        .filter(d => d.id !== currentDriverId)
        .map(d => `<option value="${d.id}" ${!d.available ? 'disabled' : ''}>${escapeHtml(d.name)}${!d.available ? ' (운행 중)' : ''}</option>`)
        .join('');
      const vehicleOpts = allVehicles
        .map(v => `<option value="${v.id}" ${v.id === trip.vehicle_id ? 'selected' : ''}>${escapeHtml(v.plate_number)} ${escapeHtml(v.model || '')}</option>`)
        .join('');

      document.getElementById('rs-driver-select').innerHTML  = `<option value="">— 기사 유지 —</option>${driverOpts}`;
      document.getElementById('rs-vehicle-select').innerHTML = `<option value="">— 차량 유지 —</option>${vehicleOpts}`;
      document.getElementById('rs-transfer-check').checked   = false;
      document.getElementById('rs-transfer-row').style.display = 'none';
      document.getElementById('rs-overlay').style.display = 'flex';

      document.getElementById('rs-driver-select').onchange = () => {
        const hasDriver = !!document.getElementById('rs-driver-select').value;
        document.getElementById('rs-transfer-row').style.display = hasDriver ? 'flex' : 'none';
      };
    }

    function closeReassignModal() {
      document.getElementById('rs-overlay').style.display = 'none';
    }

    async function runReassign() {
      const tripId   = document.getElementById('trip-info-box')._tripId;
      const driverId = document.getElementById('rs-driver-select').value;
      const vehicleId = document.getElementById('rs-vehicle-select').value;
      const transfer = document.getElementById('rs-transfer-check').checked;

      if (!driverId && !vehicleId) return alert('교체할 기사 또는 차량을 선택해주세요.');

      const confirmMsg = transfer
        ? `현재 운행을 취소하고 잔여 경유지를 새 기사에게 이관합니다.\n계속하시겠습니까?`
        : `선택한 기사/차량으로 교체하시겠습니까?`;
      if (!confirm(confirmMsg)) return;

      const body = { transfer_remaining: transfer };
      if (driverId)  body.new_driver_id   = driverId;
      if (vehicleId) body.new_vehicle_id  = parseInt(vehicleId);

      const res = await fetch(`${API}/trips/${tripId}/reassign`, {
        method: 'PATCH', headers: authHeaders(), body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json();
        return alert(`교체 실패: ${err.detail}`);
      }
      const result = await res.json();
      closeReassignModal();
      if (transfer) clearDriverRoute(currentDriverId);
      alert(transfer
        ? `✅ 이관 완료!\n잔여 경유지가 새 운행(ID: ${result.new_trip_id?.slice(0,8)}...)으로 이관됐습니다.`
        : '✅ 교체 완료!');
      await loadDrivers();
      await showDriverDetail(currentDriverId);
    }

    async function handleTripReassigned(data) {
      if (data.new_trip_id) clearDriverRoute(currentDriverId);
      await loadDrivers();
      if (currentDriverId === data.driver_id) await showDriverDetail(data.driver_id);
    }

    async function runAutoDispatch() {
      // 유효성 검사
      const errors = [];
      adTasks.forEach((task, ti) => {
        if (!task.loading) errors.push(`태스크 ${ti + 1}: 상차지를 입력하세요.`);
        task.unloadings.forEach((u, ui) => {
          if (!u) errors.push(`태스크 ${ti + 1} 하차지 ${ui + 1}: 위치를 입력하세요.`);
        });
      });
      if (adTasks.length === 0) errors.push('태스크를 1개 이상 추가하세요.');
      if (errors.length) return alert(errors.join('\n'));

      const available = adDrivers.filter(d => d.available);
      const targetDriverIds = adSelectedDriverIds.size > 0
        ? [...adSelectedDriverIds]
        : null;
      const effectiveCount = targetDriverIds
        ? targetDriverIds.length
        : available.length;
      if (effectiveCount === 0) return alert('가용 기사가 없습니다.');

      const vehicleId = document.getElementById('ad-vehicle').value;
      const departure = document.getElementById('ad-departure').value;

      const body = {
        tasks: adTasks.map(t => ({
          loading:    t.loading,
          unloadings: t.unloadings,
        })),
      };
      if (vehicleId) body.vehicle_id = parseInt(vehicleId);
      if (departure) body.departure_time = new Date(departure).toISOString();
      if (targetDriverIds) body.driver_ids = targetDriverIds;

      const res = await fetch(`${API}/trips/auto-dispatch`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json();
        return alert(`자동 배차 실패: ${err.detail}`);
      }
      const result = await res.json();
      alert(`✅ 자동 배차 완료!\n운행 ${result.created}건이 생성됐습니다.`);
      closeAutoDispatchModal();
      await loadDrivers();
    }
  </script>
</body>
