<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루트온 — 기사 채팅</title>
  <script>
    const API = 'http://168.138.45.63:8000';
    function getToken() { return localStorage.getItem('token'); }
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
    }
    if (!getToken()) window.location.href = '/login.html';
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:'Malgun Gothic', sans-serif; background:#f4f7f6; color:#333; display:flex; flex-direction:column; }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:#fff; border-bottom:2px solid #FFE812; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .brand img { height:36px; border-radius:6px; }
    .btn { border:0; border-radius:6px; padding:10px 14px; font-weight:700; cursor:pointer; background:#34495e; color:#fff; }
    .shell { flex:1; display:grid; grid-template-columns:280px 1fr; min-height:0; }
    aside { background:#fff; border-right:1px solid #e5e7eb; padding:18px; overflow-y:auto; }
    main { display:flex; flex-direction:column; min-width:0; min-height:0; }
    .partner { width:100%; text-align:left; border:1px solid #eee; background:#f8f9fa; border-radius:8px; padding:14px; margin-bottom:10px; cursor:pointer; }
    .partner.active { border-color:#FFE812; background:#fffde8; }
    .chat-title { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:#fff; border-bottom:1px solid #e5e7eb; }
    .messages { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; min-height:0; }
    .message { max-width:72%; padding:10px 12px; border-radius:8px; line-height:1.45; word-break:break-word; font-size:14px; }
    .message.mine { align-self:flex-end; background:#FFE812; }
    .message.theirs { align-self:flex-start; background:#fff; border:1px solid #e5e7eb; }
    .time { display:block; margin-top:5px; font-size:11px; color:#777; }
    .input-row { display:flex; gap:10px; padding:14px; background:#fff; border-top:1px solid #e5e7eb; }
    .input-row input { flex:1; min-width:0; border:1px solid #ddd; border-radius:6px; padding:12px; font-size:15px; }
    .empty { margin:auto; color:#777; text-align:center; font-size:14px; }
    @media (max-width: 720px) {
      header { padding:0 12px; }
      .shell { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
      aside { border-right:0; border-bottom:1px solid #e5e7eb; max-height:170px; }
      .message { max-width:86%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="./routeon_logo.png" alt="RouteOn Logo">
      <span id="page-title">기사 채팅</span>
    </div>
    <button class="btn" onclick="logout()">로그아웃</button>
  </header>

  <div class="shell">
    <aside>
      <h3 style="margin:0 0 12px;">관리자</h3>
      <div id="partners"><p style="color:#777; font-size:14px;">불러오는 중...</p></div>
    </aside>
    <main>
      <div class="chat-title">
        <strong id="conversation-title">대화를 선택하세요</strong>
        <small id="ws-state" style="color:#777;">연결 대기</small>
      </div>
      <div class="messages" id="messages">
        <p class="empty">관리자를 선택하면 대화가 표시됩니다.</p>
      </div>
      <div class="input-row">
        <input id="message-input" type="text" maxlength="2000" placeholder="메시지 입력" onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" onclick="sendMessage()">전송</button>
      </div>
    </main>
  </div>

  <script>
    let me = null;
    let partners = [];
    let currentConversation = null;
    let messages = [];
    let chatWs = null;
    let chatPingTimer = null;

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function chatWsUrl() {
      const token = encodeURIComponent(getToken());
      const apiUrl = new URL(API);
      const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${scheme}//${apiUrl.host}/ws/chat?token=${token}`;
    }

    async function loadMe() {
      const res = await fetch(`${API}/auth/me`, { headers: authHeaders() });
      if (!res.ok) { logout(); return; }
      me = await res.json();
      if (me.role !== 'driver') window.location.href = '/dashboard.html';
      document.getElementById('page-title').textContent = `${me.username} 기사`;
    }

    async function loadChatPartners() {
      const res = await fetch(`${API}/chat/partners`, { headers: authHeaders() });
      if (!res.ok) return;
      partners = await res.json();
      const box = document.getElementById('partners');
      if (!partners.length) {
        box.innerHTML = '<p style="color:#777; font-size:14px;">대화 가능한 관리자가 없습니다.</p>';
        return;
      }
      box.innerHTML = '';
      partners.forEach(partner => {
        const button = document.createElement('button');
        button.className = 'partner';
        button.id = `partner-${partner.id}`;
        button.innerHTML = `<strong>${escapeHtml(partner.username)}</strong><br><small>관리자</small>`;
        button.onclick = () => openConversation(partner.id);
        box.appendChild(button);
      });
      await openConversation(partners[0].id);
    }

    async function openConversation(partnerId) {
      document.querySelectorAll('.partner').forEach(el => el.classList.remove('active'));
      document.getElementById(`partner-${partnerId}`)?.classList.add('active');
      const partner = partners.find(p => p.id === partnerId);
      document.getElementById('conversation-title').textContent = partner ? `${partner.username} 관리자` : '대화';
      const res = await fetch(`${API}/chat/conversations`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ partner_id: partnerId })
      });
      if (!res.ok) return;
      currentConversation = await res.json();
      await loadMessages();
      await markConversationRead();
    }

    async function loadMessages(beforeMessageId = null) {
      if (!currentConversation) return;
      const params = new URLSearchParams({ limit: '50' });
      if (beforeMessageId) params.set('before_message_id', beforeMessageId);
      const res = await fetch(`${API}/chat/conversations/${currentConversation.id}/messages?${params}`, { headers: authHeaders() });
      if (!res.ok) return;
      const loaded = await res.json();
      messages = beforeMessageId ? [...loaded, ...messages] : loaded;
      renderMessages(messages, { prepend: !!beforeMessageId });
    }

    async function sendMessage() {
      if (!currentConversation) return;
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      const res = await fetch(`${API}/chat/conversations/${currentConversation.id}/messages`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ content })
      });
      if (!res.ok) {
        alert('메시지 전송에 실패했습니다.');
        input.value = content;
      }
    }

    async function markConversationRead() {
      if (!currentConversation) return;
      const last = messages[messages.length - 1];
      await fetch(`${API}/chat/conversations/${currentConversation.id}/read`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ last_read_message_id: last?.id || null })
      }).catch(() => {});
    }

    function connectChatWebSocket() {
      chatWs = new WebSocket(chatWsUrl());
      chatWs.onopen = () => {
        document.getElementById('ws-state').textContent = '연결됨';
        clearInterval(chatPingTimer);
        chatPingTimer = setInterval(() => {
          if (chatWs.readyState === WebSocket.OPEN) chatWs.send('ping');
        }, 30000);
      };
      chatWs.onmessage = (event) => {
        if (event.data === 'pong') return;
        try { handleChatEvent(JSON.parse(event.data)); }
        catch (e) { console.warn('채팅 이벤트 파싱 실패:', e); }
      };
      chatWs.onclose = () => {
        document.getElementById('ws-state').textContent = '재연결 중';
        clearInterval(chatPingTimer);
        setTimeout(connectChatWebSocket, 5000);
      };
      chatWs.onerror = () => chatWs.close();
    }

    function handleChatEvent(event) {
      if (event.type === 'chat.message' && currentConversation?.id === event.conversation_id) {
        appendMessage(event.message);
        markConversationRead();
      }
    }

    function renderMessages(items, { prepend = false } = {}) {
      const box = document.getElementById('messages');
      const previousHeight = box.scrollHeight;
      box.innerHTML = '';
      if (!items.length) {
        box.innerHTML = '<p class="empty">아직 메시지가 없습니다.</p>';
        return;
      }
      items.forEach(appendMessage);
      if (prepend) box.scrollTop = box.scrollHeight - previousHeight;
      else box.scrollTop = box.scrollHeight;
    }

    function appendMessage(message) {
      if (messages.every(m => m.id !== message.id)) messages.push(message);
      const box = document.getElementById('messages');
      const empty = box.querySelector('.empty');
      if (empty) box.innerHTML = '';
      const mine = message.sender_id === localStorage.getItem('user_id');
      const el = document.createElement('div');
      el.className = `message ${mine ? 'mine' : 'theirs'}`;
      el.innerHTML = `${escapeHtml(message.content)}<span class="time">${new Date(message.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</span>`;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    document.getElementById('messages').addEventListener('scroll', async (event) => {
      if (event.target.scrollTop === 0 && currentConversation && messages.length > 0) {
        await loadMessages(messages[0].id);
      }
    });

    (async function init() {
      await loadMe();
      await loadChatPartners();
      connectChatWebSocket();
    })();
  </script>
</body>
</html>
